name: Live model understanding evaluation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/evaluate-understanding.mjs'
      - '.github/workflows/evaluate-understanding.yml'
      - 'apps/bridge/understanding.mjs'
permissions:
  contents: read
concurrency:
  group: calypso-live-evaluation
  cancel-in-progress: true
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        group: [interpretation, doflamingo, dresden]
    env:
      CALYPSO_EVAL_MODEL: qwen3.5:4b
      CALYPSO_EVAL_GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install local inference runtime
        run: |
          curl -fsSL https://ollama.com/install.sh -o /tmp/install-ollama.sh
          sh /tmp/install-ollama.sh
          ollama serve > /tmp/ollama.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags; then break; fi
            sleep 2
          done
          ollama --version
          ollama pull "$CALYPSO_EVAL_MODEL"
      - name: Evaluate real model responses and live research
        run: node scripts/evaluate-understanding.mjs
      - name: Preserve answers, evidence and verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calypso-live-evaluation-${{ matrix.group }}
          path: evaluation-results/
          retention-days: 14
